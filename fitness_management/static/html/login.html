<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健身管理系统登录</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-page">
    <section class="login-visual">
      <div>
        <div class="sidebar-brand" style="padding: 0;">
          <span class="brand-mark">健</span>
          <div>
            <div class="brand-name">健身管理系统</div>
            <div class="brand-sub">会员、教练、课程一站式运营</div>
          </div>
        </div>
        <h1>让日常运营、课程预约和会员服务在一个平台高效完成</h1>
      </div>
      <p>支持超级管理员、前台运营、健身教练、普通会员四种角色登录，根据角色进入对应工作台。</p>
    </section>

    <section class="login-form-side">
      <div class="login-card" id="login-app" v-cloak>
        <h2>账号登录</h2>
        <p class="login-sub">选择角色并输入账号密码</p>

        <div class="role-grid">
          <button
            v-for="item in roles"
            :key="item.value"
            type="button"
            class="role-option"
            :class="{ active: form.role === item.value }"
            @click="selectRole(item.value)"
          >
            <span class="role-option-icon">{{ item.icon }}</span>
            <span class="role-option-text">
              <strong>{{ item.label }}</strong>
              <small>{{ item.desc }}</small>
            </span>
          </button>
        </div>

        <div class="login-role-tip">{{ currentRoleTip }}</div>

        <div v-if="notice" class="login-error">{{ notice }}</div>

        <div class="field">
          <label for="username">账号</label>
          <input id="username" v-model="form.username" type="text" autocomplete="username" placeholder="请输入账号">
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input id="password" v-model="form.password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>

        <form class="login-actions" @submit.prevent="handleLogin">
          <button type="submit" class="btn btn-primary" :disabled="loading">
            {{ loading ? "正在登录..." : "登录系统" }}
          </button>
        </form>

        <div class="login-tip">
          演示环境：任意角色均可使用 admin / 123456 登录，密码仅在本地页面校验。
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
