<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>器材管理 - 健身管理系统</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="equipment">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">健</span>
        <div>
          <div class="brand-name">健身管理系统</div>
          <div class="brand-sub">运营后台</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">运营管理</div>
          <a class="nav-link" data-page="dashboard" href="index.html">数据大盘</a>
          <a class="nav-link" data-page="members" href="members.html">会员管理</a>
          <a class="nav-link" data-page="coaches" href="coaches.html">教练管理</a>
          <a class="nav-link" data-page="courses" href="courses.html">课程预约</a>
          <a class="nav-link" data-page="equipment" href="equipment.html">器材管理</a>
          <a class="nav-link" data-page="system" href="system.html">系统配置</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">业务入口</div>
          <a class="nav-link" href="reception.html">前台运营工作台</a>
          <a class="nav-link" href="member_center.html">会员个人中心</a>
          <a class="nav-link" href="coach_panel.html">教练工作台</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div>当前日期：<span data-current-date></span></div>
        <div>© <span data-current-year></span> 健身管理系统</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="打开菜单">☰</button>
          <div class="topbar-title" data-dynamic-title="equipment">器材管理</div>
        </div>
        <div class="topbar-right">
          <div class="user-chip">
            <span class="user-avatar">管</span>
            <span>超级管理员</span>
          </div>
          <button class="btn btn-secondary btn-sm" id="logout-btn" type="button">退出</button>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <div>
            <h1 data-dynamic-title="equipment">器材管理</h1>
            <p class="page-desc" data-dynamic-desc="equipment">维护器材档案、报修维修、盘点和保养记录。</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" type="button" id="add-equipment-btn">新增器材</button>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-icon">器</div>
            <div>
              <div class="stat-card-value">56</div>
              <div class="stat-card-label">器材总数</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">正</div>
            <div>
              <div class="stat-card-value">48</div>
              <div class="stat-card-label">正常</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon warn">修</div>
            <div>
              <div class="stat-card-value">6</div>
              <div class="stat-card-label">维修中</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon danger">废</div>
            <div>
              <div class="stat-card-value">2</div>
              <div class="stat-card-label">已报废</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-body">
            <div class="filter-bar">
              <div class="field">
                <label for="equipment-keyword">关键词</label>
                <input id="equipment-keyword" type="search" placeholder="器材名称、型号或位置">
              </div>
              <div class="field">
                <label for="equipment-status-filter">状态</label>
                <select id="equipment-status-filter">
                  <option value="">全部状态</option>
                  <option value="正常">正常</option>
                  <option value="维修">维修</option>
                  <option value="报废">报废</option>
                </select>
              </div>
              <div class="field">
                <label for="equipment-category-filter">分类</label>
                <select id="equipment-category-filter">
                  <option value="">全部分类</option>
                  <option value="有氧器械">有氧器械</option>
                  <option value="力量器械">力量器械</option>
                  <option value="自由重量">自由重量</option>
                  <option value="瑜伽普拉提">瑜伽普拉提</option>
                  <option value="辅助器材">辅助器材</option>
                </select>
              </div>
              <div class="page-actions" style="align-self: flex-end;">
                <button class="btn btn-primary" type="button" id="equipment-search-btn">查询</button>
                <button class="btn btn-secondary" type="button" id="equipment-reset-btn">重置</button>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">器材列表</h2>
            <span class="badge info" id="equipment-count">共 0 条</span>
          </div>
          <div class="panel-body no-padding">
            <div class="data-table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>器材名称</th>
                    <th>型号</th>
                    <th>分类</th>
                    <th>存放位置</th>
                    <th>采购时间</th>
                    <th>价格</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="equipment-table-body"></tbody>
              </table>
            </div>
            <div class="pagination" id="equipment-pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新增编辑器材弹窗 -->
  <div class="modal-mask" id="equipment-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="equipment-modal-title">新增器材</h3>
        <button class="icon-btn" type="button" data-close-modal="equipment-modal">×</button>
      </div>
      <div class="modal-body">
        <form id="equipment-form">
          <input type="hidden" id="equipment-id">
          <div class="form-grid">
            <div class="field">
              <label for="equipment-name">器材名称</label>
              <input id="equipment-name" type="text" placeholder="请输入器材名称" required>
            </div>
            <div class="field">
              <label for="equipment-model">型号</label>
              <input id="equipment-model" type="text" placeholder="请输入型号">
            </div>
            <div class="field">
              <label for="equipment-category">分类</label>
              <select id="equipment-category">
                <option value="有氧器械">有氧器械</option>
                <option value="力量器械">力量器械</option>
                <option value="自由重量">自由重量</option>
                <option value="瑜伽普拉提">瑜伽普拉提</option>
                <option value="辅助器材">辅助器材</option>
              </select>
            </div>
            <div class="field">
              <label for="equipment-location">存放位置</label>
              <input id="equipment-location" type="text" placeholder="请输入存放位置">
            </div>
            <div class="field">
              <label for="equipment-purchase-date">采购时间</label>
              <input id="equipment-purchase-date" type="date">
            </div>
            <div class="field">
              <label for="equipment-price">采购价格</label>
              <input id="equipment-price" type="number" min="0" step="0.01" placeholder="请输入价格">
            </div>
            <div class="field">
              <label for="equipment-status">状态</label>
              <select id="equipment-status">
                <option value="正常">正常</option>
                <option value="维修">维修</option>
                <option value="报废">报废</option>
              </select>
            </div>
            <div class="field full">
              <label for="equipment-remark">备注</label>
              <textarea id="equipment-remark" placeholder="填写器材备注"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-modal="equipment-modal">取消</button>
        <button class="btn btn-primary" type="button" id="save-equipment-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 报修维修弹窗 -->
  <div class="modal-mask" id="repair-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">报修登记：<span id="repair-equipment-name"></span></h3>
        <button class="icon-btn" type="button" data-close-modal="repair-modal">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="repair-equipment-id">
        <div class="form-grid">
          <div class="field full">
            <label for="repair-desc">故障描述</label>
            <textarea id="repair-desc" placeholder="请描述器材故障情况"></textarea>
          </div>
          <div class="field">
            <label for="repair-cost">维修费用</label>
            <input id="repair-cost" type="number" min="0" step="0.01" placeholder="请输入维修费用">
          </div>
          <div class="field">
            <label for="repair-date">维修完成时间</label>
            <input id="repair-date" type="date">
          </div>
          <div class="field full">
            <label for="repair-remark">维修备注</label>
            <textarea id="repair-remark" placeholder="填写维修结果"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-modal="repair-modal">取消</button>
        <button class="btn btn-primary" type="button" id="save-repair-btn">提交维修</button>
      </div>
    </div>
  </div>

  <!-- 保养记录弹窗 -->
  <div class="modal-mask" id="maintenance-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">保养记录：<span id="maintenance-equipment-name"></span></h3>
        <button class="icon-btn" type="button" data-close-modal="maintenance-modal">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="maintenance-equipment-id">
        <div class="form-grid">
          <div class="field">
            <label for="maintenance-date">保养时间</label>
            <input id="maintenance-date" type="date">
          </div>
          <div class="field">
            <label for="maintenance-person">保养人</label>
            <input id="maintenance-person" type="text" placeholder="请输入保养人">
          </div>
          <div class="field full">
            <label for="maintenance-content">保养内容</label>
            <textarea id="maintenance-content" placeholder="填写保养项目和检查结果"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-modal="maintenance-modal">取消</button>
        <button class="btn btn-primary" type="button" id="save-maintenance-btn">保存记录</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="confirm-modal">
    <div class="modal sm">
      <div class="modal-header">
        <h3 class="modal-title">操作确认</h3>
        <button class="icon-btn" type="button" data-close-modal="confirm-modal">×</button>
      </div>
      <div class="modal-body">
        <p id="confirm-message" style="margin: 0;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" id="confirm-cancel">取消</button>
        <button class="btn btn-primary" type="button" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/equipment.js"></script>
</body>
</html>
