<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教练工作台 - 健身管理系统</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="coach_panel">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">健</span>
        <div>
          <div class="brand-name">健身管理系统</div>
          <div class="brand-sub">教练工作台</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">教练服务</div>
          <a class="nav-link" data-page="coach_panel" href="coach_panel.html">我的工作台</a>
          <a class="nav-link" href="courses.html">课程中心</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">管理入口</div>
          <a class="nav-link" href="index.html">管理员后台</a>
          <a class="nav-link" href="member_center.html">会员个人中心</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div>当前日期：<span data-current-date></span></div>
        <div>© <span data-current-year></span> 健身管理系统</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="打开菜单">☰</button>
          <div class="topbar-title">教练工作台</div>
        </div>
        <div class="topbar-right">
          <div class="user-chip">
            <span class="user-avatar">张</span>
            <span>张昊 · 健身教练</span>
          </div>
          <button class="btn btn-secondary btn-sm" id="logout-btn" type="button">退出</button>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>教练工作台</h1>
            <p class="page-desc">查看排课、学员、授课记录并制定训练计划。</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" type="button" id="add-schedule-btn">新增排课</button>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-icon">排</div>
            <div>
              <div class="stat-card-value">18</div>
              <div class="stat-card-label">本月排课</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">课</div>
            <div>
              <div class="stat-card-value">42</div>
              <div class="stat-card-label">已授课时</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">学</div>
            <div>
              <div class="stat-card-value">16</div>
              <div class="stat-card-label">我的学员</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">分</div>
            <div>
              <div class="stat-card-value">4.9</div>
              <div class="stat-card-label">平均评分</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="tabs" id="coach-tabs">
            <button class="tab-btn active" type="button" data-tab="schedule">我的排课</button>
            <button class="tab-btn" type="button" data-tab="students">我的学员</button>
            <button class="tab-btn" type="button" data-tab="records">授课记录</button>
            <button class="tab-btn" type="button" data-tab="plans">训练计划</button>
          </div>

          <div class="tab-content active" id="tab-schedule">
            <div class="panel-body no-padding">
              <div class="data-table-wrap">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>日期</th>
                      <th>时段</th>
                      <th>课程</th>
                      <th>地点</th>
                      <th>预约人数</th>
                      <th>状态</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="coach-schedule-body"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="tab-content" id="tab-students">
            <div class="panel-body no-padding">
              <div class="data-table-wrap">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>学员</th>
                      <th>手机号</th>
                      <th>训练目标</th>
                      <th>当前计划</th>
                      <th>最近训练</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="coach-students-body"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="tab-content" id="tab-records">
            <div class="panel-body no-padding">
              <div class="data-table-wrap">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>日期</th>
                      <th>课程</th>
                      <th>学员</th>
                      <th>课时</th>
                      <th>评分</th>
                      <th>评价</th>
                    </tr>
                  </thead>
                  <tbody id="coach-records-body"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="tab-content" id="tab-plans">
            <div class="panel-body">
              <div class="page-actions" style="margin-bottom: 16px;">
                <button class="btn btn-primary" type="button" id="add-plan-btn">新增训练计划</button>
              </div>
              <div class="data-table-wrap">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>学员</th>
                      <th>训练目标</th>
                      <th>主要部位</th>
                      <th>动作内容</th>
                      <th>组数次数</th>
                      <th>频率</th>
                      <th>有效期</th>
                    </tr>
                  </thead>
                  <tbody id="coach-plans-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新增排课弹窗 -->
  <div class="modal-mask" id="coach-schedule-modal">
    <div class="modal sm">
      <div class="modal-header">
        <h3 class="modal-title">新增排课</h3>
        <button class="icon-btn" type="button" data-close-modal="coach-schedule-modal">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field">
            <label for="schedule-course">课程</label>
            <select id="schedule-course">
              <option value="增肌基础课">增肌基础课</option>
              <option value="一对一塑形">一对一塑形</option>
              <option value="肩颈力量训练">肩颈力量训练</option>
            </select>
          </div>
          <div class="field">
            <label for="schedule-date">日期</label>
            <input id="schedule-date" type="date">
          </div>
          <div class="field">
            <label for="schedule-start">开始时间</label>
            <input id="schedule-start" type="time" value="19:00">
          </div>
          <div class="field">
            <label for="schedule-end">结束时间</label>
            <input id="schedule-end" type="time" value="20:00">
          </div>
          <div class="field full">
            <label for="schedule-location">地点</label>
            <input id="schedule-location" type="text" placeholder="请输入上课地点">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-modal="coach-schedule-modal">取消</button>
        <button class="btn btn-primary" type="button" id="save-coach-schedule-btn">保存排课</button>
      </div>
    </div>
  </div>

  <!-- 训练计划弹窗 -->
  <div class="modal-mask" id="plan-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">制定训练计划</h3>
        <button class="icon-btn" type="button" data-close-modal="plan-modal">×</button>
      </div>
      <div class="modal-body">
        <form id="plan-form">
          <div class="form-grid">
            <div class="field">
              <label for="plan-student">学员</label>
              <select id="plan-student">
                <option value="王琳">王琳</option>
                <option value="陈晨">陈晨</option>
                <option value="郑雪">郑雪</option>
                <option value="郭磊">郭磊</option>
              </select>
            </div>
            <div class="field">
              <label for="plan-goal">训练目标</label>
              <select id="plan-goal">
                <option value="增肌">增肌</option>
                <option value="减脂">减脂</option>
                <option value="塑形">塑形</option>
                <option value="体态调整">体态调整</option>
              </select>
            </div>
            <div class="field">
              <label for="plan-part">训练部位</label>
              <input id="plan-part" type="text" placeholder="例如：胸、背、腿">
            </div>
            <div class="field">
              <label for="plan-action">动作内容</label>
              <input id="plan-action" type="text" placeholder="例如：杠铃卧推、深蹲">
            </div>
            <div class="field">
              <label for="plan-sets">组数次数</label>
              <input id="plan-sets" type="text" placeholder="例如：4 组 × 10 次">
            </div>
            <div class="field">
              <label for="plan-frequency">训练频率</label>
              <input id="plan-frequency" type="text" placeholder="例如：每周 3 次">
            </div>
            <div class="field">
              <label for="plan-start">开始日期</label>
              <input id="plan-start" type="date">
            </div>
            <div class="field">
              <label for="plan-end">结束日期</label>
              <input id="plan-end" type="date">
            </div>
            <div class="field full">
              <label for="plan-remark">计划说明</label>
              <textarea id="plan-remark" placeholder="填写饮食、休息或动作要点"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-modal="plan-modal">取消</button>
        <button class="btn btn-primary" type="button" id="save-plan-btn">保存计划</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="confirm-modal">
    <div class="modal sm">
      <div class="modal-header">
        <h3 class="modal-title">操作确认</h3>
        <button class="icon-btn" type="button" data-close-modal="confirm-modal">×</button>
      </div>
      <div class="modal-body">
        <p id="confirm-message" style="margin: 0;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" id="confirm-cancel">取消</button>
        <button class="btn btn-primary" type="button" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/coach_panel.js"></script>
</body>
</html>
